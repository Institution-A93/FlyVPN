name: integration
# Интеграционные проверки на полноценном раннере-VM (ядерный IPsec/привилегии есть,
# в отличие от dev-песочницы). Гоняют то, что раньше считалось «только на узле».
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "services/**"
      - "infra/ansible/roles/control-plane/templates/sql.j2"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "infra/ansible/roles/control-plane/templates/sql.j2"
permissions:
  contents: read

jobs:
  control-db:
    # Go-интеграционные тесты (contract/fleet) против реального Postgres 16.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: radius
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Apply schema (0001 + 0006)
        env: { PGPASSWORD: pg }
        run: |
          for f in 0001_init 0006_radacct_entitlement_limits; do
            psql -h localhost -U postgres -d radius -v ON_ERROR_STOP=1 \
              -f services/db/migrations/${f}.up.sql
          done
      - name: Integration tests (contract + fleet)
        working-directory: services/control
        env:
          CONTROL_TEST_DSN: postgres://postgres:pg@localhost:5432/radius
        run: go test ./... -count=1

  engine-e2e:
    # Движок entitlement end-to-end: FreeRADIUS + PostgreSQL + наш sql.j2.
    # Воспроизводит спайк: анти-локаут (2 пула), срок, кап, accounting, revoke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PG + FreeRADIUS + eapol_test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql freeradius freeradius-postgresql eapoltest
      - name: Setup radius DB (schema 0001 + 0006) + seed user
        run: |
          sudo pg_ctlcluster 16 main start || sudo pg_ctlcluster 16 main restart
          sleep 3
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE radius LOGIN PASSWORD 'radpw';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE radius OWNER radius;"
          export PGPASSWORD=radpw
          for f in 0001_init 0006_radacct_entitlement_limits; do
            psql -h 127.0.0.1 -U radius -d radius -v ON_ERROR_STOP=1 \
              -f services/db/migrations/${f}.up.sql
          done
          PW='Correct-Horse-9'
          NT=$(printf '%s' "$PW" | iconv -t utf-16le | openssl dgst -md4 -provider legacy -provider default | awk '{print $NF}')
          psql -h 127.0.0.1 -U radius -d radius -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO users (id,status) VALUES ('11111111-1111-1111-1111-111111111111','active');
          INSERT INTO auth_credentials (user_id,username,nt_hash,framed_ip,expires_at,traffic_cap_bytes,period_start)
          VALUES ('11111111-1111-1111-1111-111111111111','alice','$NT','10.8.0.5', now()+interval '30 days', 104857600, now());
          SQL
      - name: Configure FreeRADIUS (render sql.j2; acct via stock default site)
        # Каталог /etc/freeradius/3.0 — root:freerad 0750, runner внутрь зайти не может
        # (cd → Permission denied). Пишем по абсолютным путям через sudo tee, без cd.
        run: |
          FR=/etc/freeradius/3.0
          sudo sed -e 's/{{ cp_freeradius_dialect }}/postgresql/;s/{{ cp_db_host }}/127.0.0.1/;s/{{ cp_db_port }}/5432/;s/{{ cp_db_radius_user }}/radius/;s/{{ cp_db_radius_password }}/radpw/;s/{{ cp_db_name }}/radius/' \
            -e '/{% raw %}/d;/{% endraw %}/d' \
            "$GITHUB_WORKSPACE/infra/ansible/roles/control-plane/templates/sql.j2" | sudo tee "$FR/mods-available/sql" >/dev/null
          sudo ln -sf ../mods-available/sql "$FR/mods-enabled/sql"
          # Acct на 1813 даёт стоковый sites-enabled/default (его accounting{} зовёт sql).
          sudo freeradius -XC
      - name: Run engine scenarios (assert anti-lockout / quota / accounting)
        run: |
          set -e
          # apt автозапустил freeradius.service (stock-конфиг, держит 1812/1813); debug-инстанс
          # не забиндит порты, а radtest упрётся в stock-сервис без нашего sql-модуля.
          sudo systemctl stop freeradius 2>/dev/null || true
          sudo freeradius -X >/tmp/fr.log 2>&1 &
          for i in $(seq 1 30); do grep -q "Ready to process requests" /tmp/fr.log && break; sleep 1; done
          grep -q "Ready to process requests" /tmp/fr.log || { echo "FreeRADIUS не поднялся:"; tail -50 /tmp/fr.log; exit 1; }
          RUN() { PGPASSWORD=radpw psql -h 127.0.0.1 -U radius -d radius -tAc "$1"; }
          fip() { radtest -t mschap alice 'Correct-Horse-9' 127.0.0.1:1812 0 testing123 2>&1; }
          DIAG() { echo "---- radtest ----"; fip; echo "---- sql connect/auth trace ----"; grep -nE "rlm_sql|Connected|Failed to connect|NT-Password|Cleartext|mschap|Login incorrect|Access-(Accept|Reject)|sql_user_name|expand|No such|denied|ERROR" /tmp/fr.log | tail -80; }

          echo "== active → Accept + 10.8 =="
          fip | grep -q "Access-Accept" || { echo "FAIL active accept"; DIAG; exit 1; }
          fip | grep -qE "Framed-IP-Address = 10\.(8|9|10|11)\." || { echo FAIL active pool; exit 1; }

          echo "== EAP-MSCHAPv2 (path strongSwan) success =="
          printf 'network={\n\tkey_mgmt=IEEE8021X\n\teap=MSCHAPV2\n\tidentity="alice"\n\tpassword="Correct-Horse-9"\n}\n' >/tmp/eap.conf
          eapol_test -c /tmp/eap.conf -a 127.0.0.1 -p 1812 -s testing123 2>&1 | grep -q "^SUCCESS" || { echo FAIL eap; exit 1; }

          echo "== expired → Accept + 10.12 (anti-lockout) =="
          RUN "UPDATE auth_credentials SET expires_at=now()-interval '1 day' WHERE username='alice'" >/dev/null
          fip | grep -qE "Framed-IP-Address = 10\.(12|13|14|15)\." || { echo FAIL lapsed pool; exit 1; }
          RUN "UPDATE auth_credentials SET expires_at=now()+interval '30 days' WHERE username='alice'" >/dev/null

          echo "== over-cap → 10.12 =="
          RUN "INSERT INTO radacct (acctsessionid,acctuniqueid,username,nasipaddress,acctstarttime,acctinputoctets,acctoutputoctets) VALUES ('x','x1','alice','127.0.0.1',now(),200000000,0)" >/dev/null
          fip | grep -qE "Framed-IP-Address = 10\.(12|13|14|15)\." || { echo FAIL overcap pool; exit 1; }
          RUN "DELETE FROM radacct WHERE username='alice'" >/dev/null

          echo "== accounting Start/Interim → radacct (interim dedup) =="
          acct() { printf "%s\n" "$1" | radclient 127.0.0.1:1813 acct testing123 >/dev/null 2>&1; }
          acct "User-Name=alice
          Acct-Status-Type=Start
          Acct-Session-Id=s1
          Acct-Unique-Session-Id=u1
          NAS-IP-Address=127.0.0.1
          Acct-Input-Octets=0
          Acct-Output-Octets=0"
          acct "User-Name=alice
          Acct-Status-Type=Interim-Update
          Acct-Session-Id=s1
          Acct-Unique-Session-Id=u1
          NAS-IP-Address=127.0.0.1
          Acct-Input-Octets=52428800
          Acct-Output-Octets=10485760"
          sleep 1
          USED=$(RUN "SELECT acctinputoctets+acctoutputoctets FROM radacct WHERE username='alice'")
          [ "$USED" = "62914560" ] || { echo "FAIL accounting (got $USED)"; exit 1; }

          echo "== revoked → Reject =="
          RUN "DELETE FROM radacct WHERE username='alice'; UPDATE auth_credentials SET revoked_at=now() WHERE username='alice'" >/dev/null
          fip | grep -q "Access-Reject" || { echo FAIL revoke reject; exit 1; }

          echo "ALL ENGINE SCENARIOS PASSED"
