name: os-debug
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-pasteur-2IMEz]
    paths: [".github/workflows/os-debug.yml"]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: OpenStack failure diagnosis
        env:
          OPENSTACK_RC: ${{ secrets.OPENSTACK_RC }}
        run: |
          set +x
          umask 077
          printf '%s\n' "$OPENSTACK_RC" > os.rc
          # shellcheck disable=SC1091
          source ./os.rc
          rm -f os.rc
          python -m pip install --quiet python-openstackclient
          echo "===== VOLUME TYPES ====="; openstack volume type list -f value -c Name || true
          echo "===== FLAVOR SL1.2-4096-32 ====="; openstack flavor show SL1.2-4096-32 -f json || true
          echo "===== ERRORED SERVER FAULT ====="; openstack server show d1523de3-61a0-461c-b66c-a313e608d775 -c status -c fault -f json || true
