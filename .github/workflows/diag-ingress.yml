name: diag-ingress
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-pasteur-2IMEz]
    paths: [".github/workflows/diag-ingress.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Verify eap-radius plugin + RADIUS path
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@87.228.102.223 '
            echo "== eap-radius in loaded plugins? =="
            journalctl -u strongswan-starter --no-pager 2>/dev/null | grep -i "loaded plugins: charon" | tail -1 | tr " " "\n" | grep -i "radius\|eap-" || echo "NO eap-radius in loaded plugins"
            echo "== RADIUS path test (expect Access-Reject = reachable + secret OK) =="
            apt-get install -y -q freeradius-utils >/dev/null 2>&1 || true
            SEC=$(grep -oP "secret\s*=\s*\K\S+" /etc/strongswan.d/charon/eap-radius.conf | head -1)
            RS=$(grep -oP "address\s*=\s*\K\S+" /etc/strongswan.d/charon/eap-radius.conf | head -1)
            echo "radius server: $RS"
            radtest probeuser probepass "$RS" 0 "$SEC" 2>&1 | grep -iE "Access-(Accept|Reject)|no response|timed out|Receive" | head -8 || echo "radtest: no usable output"
          '
