name: diag-ingress
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-pasteur-2IMEz]
    paths: [".github/workflows/diag-ingress.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Capture real client IKE/EAP/RADIUS outcome
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@87.228.102.223 '
            echo "== active SAs (established?) =="; swanctl --list-sas 2>&1 | head -25 || echo none
            echo "== client IKE/EAP/RADIUS events (last 6 min) =="
            journalctl -u strongswan-starter --since "-6min" --no-pager 2>&1 \
              | grep -iE "EAP|RADIUS|authentication (of|failed|succ)|established|CHILD_SA|installing|Access-|reauth|retransmit|received cfg|assigned|no shared|timeout" \
              | grep -ivE "scanner|listplugins" \
              | tail -90 || echo "no client events in window"
          '
