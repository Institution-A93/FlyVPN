name: diag-ingress
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-pasteur-2IMEz]
    paths: [".github/workflows/diag-ingress.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Verify client DNS hijack + full fetch from pool src
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@87.228.102.223 '
            set +e
            command -v dig >/dev/null || apt-get install -y -q dnsutils >/dev/null 2>&1
            echo "== pushed client DNS in swanctl pool =="; grep -A4 client_pool /etc/swanctl/swanctl.conf | grep dns
            ip addr add 10.8.0.9/32 dev lo 2>/dev/null
            echo "== DNS to 1.1.1.1 from pool src (mimics phone, expect A record) =="
            dig +timeout=6 +tries=1 -b 10.8.0.9 @1.1.1.1 example.com A +short 2>&1 | head -3
            echo "== resolve a RU domain via 1.1.1.1 (expect RU A) =="
            dig +timeout=6 +tries=1 -b 10.8.0.9 @1.1.1.1 gosuslugi.ru A +short 2>&1 | head -3
            ip addr del 10.8.0.9/32 dev lo 2>/dev/null
          '
