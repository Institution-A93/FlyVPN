name: diag-ingress
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-pasteur-2IMEz]
    paths: [".github/workflows/diag-ingress.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect + rebuild RU rule_set, restart sing-box
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@87.228.102.223 '
            echo "== current ru.srs =="; ls -l /var/lib/sing-box/ru.srs 2>&1 || echo absent
            echo "== rebuild ru.srs (runs updater; shows prefix count) =="
            /usr/local/sbin/update-ru-ruleset.sh 2>&1 | tail -5 || echo "updater FAILED"
            echo "== ru.srs after =="; ls -l /var/lib/sing-box/ru.srs 2>&1 || echo absent
            echo "== restart sing-box =="; systemctl restart sing-box && sleep 2 && systemctl is-active sing-box
            echo "== sing-box log tail =="; journalctl -u sing-box --no-pager -n 12 2>&1 | tail -12
          '
