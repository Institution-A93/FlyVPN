name: diag-ingress
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-pasteur-2IMEz]
    paths: [".github/workflows/diag-ingress.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Test client DNS path (172.19.0.1 pushed to client)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@87.228.102.223 '
            set +e
            command -v dig >/dev/null || apt-get install -y -q dnsutils >/dev/null 2>&1
            ip addr add 10.8.0.9/32 dev lo 2>/dev/null
            echo "== DNS to 172.19.0.1 from pool src (mimics phone) =="
            dig +timeout=5 +tries=1 -b 10.8.0.9 @172.19.0.1 example.com A +short 2>&1 | head -5 || true
            echo "rc=$?"
            echo "== DNS to 172.19.0.1 (no source bind) =="
            dig +timeout=5 +tries=1 @172.19.0.1 example.com A +short 2>&1 | head -5 || true
            echo "== for comparison: full fetch with that DNS forced (pool src) =="
            curl --interface 10.8.0.9 --dns-servers 172.19.0.1 -s -m 15 https://ipinfo.io/ip 2>&1 | head -3 || echo "curl --dns-servers unsupported or FAIL"
            echo "== sing-box dns-related log =="; journalctl -u sing-box --no-pager -n 15 2>&1 | grep -iE "dns|sniff|reject|error" | tail -10 || echo "(no dns log lines)"
            ip addr del 10.8.0.9/32 dev lo 2>/dev/null
          '
