name: diag-ingress
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-pasteur-2IMEz]
    paths: [".github/workflows/diag-ingress.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe IKEv2/mesh state on ingress
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@87.228.102.223 '
            echo "== services =="; systemctl is-active strongswan-starter sing-box mesh-route 2>&1 || true
            echo "== swanctl conns =="; swanctl --list-conns 2>&1 | head -30 || echo "none/err"
            echo "== IKE listen =="; ss -lunp 2>/dev/null | grep -E ":500|:4500" || echo "not listening"
            echo "== sing-box tun =="; ip -br addr show sb-tun 2>&1 || true
            echo "== sing-box log =="; journalctl -u sing-box --no-pager -n 6 2>&1 || true
          '
