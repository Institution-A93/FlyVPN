name: diag-ingress
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-pasteur-2IMEz]
    paths: [".github/workflows/diag-ingress.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose gosuslugi routing
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@87.228.102.223 '
            set +e
            echo "== gosuslugi IPs (via our DNS path) =="
            for h in gosuslugi.ru www.gosuslugi.ru esia.gosuslugi.ru; do
              echo -n "$h -> "; dig +short +timeout=5 @1.1.1.1 "$h" A | tr "\n" " "; echo
            done
            echo "== is 213.59.x / those IPs in ipdeny RU zone? =="
            curl -fsSL -m 20 https://www.ipdeny.com/ipblocks/data/countries/ru.zone -o /tmp/ru.zone && wc -l < /tmp/ru.zone
            grep -E "^213\.59\." /tmp/ru.zone | head -5 || echo "213.59.x NOT in RU zone"
            echo "== fetch gosuslugi as client (pool src) =="
            ip addr add 10.8.0.9/32 dev lo 2>/dev/null
            curl --interface 10.8.0.9 -s -m 20 -o /dev/null -w "code=%{http_code} exit_remote=%{remote_ip} t=%{time_total}s\n" https://www.gosuslugi.ru/ 2>&1
            ip addr del 10.8.0.9/32 dev lo 2>/dev/null
          '
