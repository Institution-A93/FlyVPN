name: diag-ingress
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-pasteur-2IMEz]
    paths: [".github/workflows/diag-ingress.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: gosuslugi direct vs tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@87.228.102.223 '
            set +e
            curl -fsSL -m 20 https://www.ipdeny.com/ipblocks/data/countries/ru.zone -o /tmp/ru.zone 2>/dev/null
            echo "== blocks covering 213.59.24x-25x =="; grep -E "^213\.59\.(192|224|240|248|252|254|253)" /tmp/ru.zone || echo "no high-213.59 block (.253 likely NOT covered)"
            echo "== HOST direct (ingress RU IP, no tunnel) to gosuslugi =="
            curl -s -m 15 -o /dev/null -w "code=%{http_code} dst=%{remote_ip} t=%{time_total}s\n" https://www.gosuslugi.ru/ 2>&1
            echo "== HOST direct: what is our public IP (sanity) =="
            curl -s -m 10 https://ipinfo.io/ip 2>&1; echo
            echo "== via pool src (tunnel split) to gosuslugi =="
            ip addr add 10.8.0.9/32 dev lo 2>/dev/null
            curl --interface 10.8.0.9 -s -m 15 -o /dev/null -w "code=%{http_code} dst=%{remote_ip} t=%{time_total}s\n" https://www.gosuslugi.ru/ 2>&1
            ip addr del 10.8.0.9/32 dev lo 2>/dev/null
          '
