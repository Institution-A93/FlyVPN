---
- name: restart freeradius
  ansible.builtin.systemd:
    name: freeradius
    state: restarted

- name: restart config-api
  ansible.builtin.systemd:
    name: config-api
    state: restarted
    daemon_reload: true

- name: restart account-api
  ansible.builtin.systemd:
    name: account-api
    state: restarted
    daemon_reload: true
  # Без JWT-секрета сервис не стартует — не дёргаем рестарт (иначе handler упадёт).
  when: cp_accountapi_jwt_secret | length > 0

- name: restart orchestrator
  ansible.builtin.systemd:
    name: orchestrator
    state: restarted
    daemon_reload: true
