---
# --- PostgreSQL ---
cp_db_host: "127.0.0.1"
cp_db_port: 5432
cp_db_name: "smartinternet"
cp_db_app_user: "si_app"        # владелец схемы; config-api/orchestrator
cp_db_radius_user: "si_radius"  # read-only роль для FreeRADIUS (только SELECT)

# Путь к миграциям (services/db) на control plane после доставки.
cp_migrations_dir: "/opt/smartinternet/db/migrations"
# Источник миграций в репозитории (относительно playbook) для доставки на узел.
cp_migrations_src: "{{ playbook_dir }}/../../services/db/migrations/"

# --- FreeRADIUS ---
cp_freeradius_dialect: "postgresql"

# --- СЕКРЕТЫ (vault, ADR-0012) — по умолчанию пусты, tasks падают без них ---
cp_db_app_password: ""          # пароль роли si_app
cp_db_radius_password: ""       # пароль роли si_radius
# RADIUS-клиенты (ingress-узлы): [{name, ipaddr, secret}]. На MMVP может быть пусто
# (ingress ещё нет) — тогда FreeRADIUS поднимется без внешних клиентов.
cp_radius_clients: []

# --- Go-сервисы (config-api, orchestrator) ---
cp_go_version: "1.23.4"           # пин тулчейна для сборки на узле
cp_go_arch: "amd64"               # CCX = x86
cp_src_dir: "/opt/smartinternet/src"
cp_services_src: "{{ playbook_dir }}/../../services/"   # источник в репозитории

# config-api: домен и параметры профиля
cp_configapi_acme_domain: "api.fly-vpn.net"
cp_configapi_vpn_remote: "vpn.fly-vpn.net"     # RemoteAddress в .mobileconfig
cp_configapi_vpn_remote_id: "vpn.fly-vpn.net"  # id сервера (CN серта IKEv2)
cp_configapi_server_ca_cn: "R3"                # CN издателя серверного серта (Let's Encrypt)
cp_configapi_org: "Smart Internet"
cp_configapi_display_name: "Smart Internet"

# Digiseller (Plati). ОПЦИОНАЛЬНО: без них config-api стартует, но /plati/issue -> 503.
# seller_id и api_key — из vault, когда заведён аккаунт продавца.
cp_digiseller_seller_id: ""        # числовой ID продавца
cp_digiseller_api_key: ""          # API key Digiseller (vault)
cp_plan_by_goods: ""               # "5937891:30d" (id товара Plati -> план); см. vault.yml.example
cp_default_plan: "30d"

cp_orch_listen: ":9090"
cp_orch_health_interval: "30s"

# --- account-api (веб-кабинет MVP, ADR-0020) ---
# Слушает plain-HTTP на :8080; TLS и публичный домен (api.flynet.pro) — за reverse-proxy
# (config-api уже держит :443 на этом узле). Запускается только при заданном JWT-секрете.
cp_accountapi_listen: ":8080"
cp_accountapi_public_base_url: "https://flynet.pro"
cp_accountapi_vpn_remote: "{{ cp_configapi_vpn_remote }}"        # тот же ingress-endpoint
cp_accountapi_vpn_remote_id: "{{ cp_configapi_vpn_remote_id }}"
cp_accountapi_org: "FLY VPN"
cp_accountapi_display_name: "FLY VPN"
# СЕКРЕТЫ (vault, ADR-0012) — по умолчанию пусты. Без JWT-секрета сервис не запускается.
cp_accountapi_jwt_secret: ""           # подпись access-JWT (обяз. для запуска)
cp_accountapi_telegram_bot_token: ""   # валидация Telegram login-widget (опц.)
cp_accountapi_twilio_sid: ""           # Twilio (опц.; без него OTP = 0000)
cp_accountapi_twilio_token: ""
cp_accountapi_twilio_from: ""
cp_accountapi_platega_base_url: "https://app.platega.io"
cp_accountapi_platega_merchant_id: "" # Platega (опц.; без него purchase/webhook -> 503)
cp_accountapi_platega_secret: ""

# control — единый бинарь (ADR-0021). Профильные дефолты переиспользуют cp_configapi_*.
cp_control_listen: "127.0.0.1:8080"   # внутренний листенер (за приватной сетью)
cp_control_operator_token: ""         # bearer для панели/API оператора (из vault)
cp_control_webhook_secret: ""         # секрет для платёжных коннекторов (из vault)
cp_control_dae_secret: ""             # общий секрет CoA/DAE с узлами (из vault)
cp_control_dae_port: 3799
cp_radius_acct_port: 1813              # FreeRADIUS acct-листенер (приём accounting от ingress)
