---
# Системный DNS — ПУБЛИЧНЫЕ резолверы ДО любых apt. Работают и на Hetzner, и на Selectel
# (резолверы Hetzner 185.12.64.x с RU-узлов недостижимы → DNS/скачивания висли). Чинит и
# возможный перехват resolv.conf локальным unbound от предыдущего прогона.
- name: Системный resolv.conf — публичные резолверы
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Управляется Ansible (роль common). Публичные резолверы (универсально).
      nameserver 1.1.1.1
      nameserver 8.8.8.8

# SSH: вариант A (ADR-0016) — порт открыт, защита только ключом + fail2ban.
- name: Установить fail2ban
  ansible.builtin.apt:
    name: [fail2ban]
    state: present
    update_cache: true

- name: SSH-харданинг (drop-in)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-flyvpn.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Управляется Ansible (роль common, ADR-0016). Только ключи.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
  notify: restart ssh

- name: Jail fail2ban для sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      bantime = 1h
  notify: restart fail2ban

- name: Включить fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
